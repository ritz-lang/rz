[package]
name = "valet"
version = "0.1.0"
description = "High-performance HTTP server framework for Ritz"

# Source roots - directory expands to **/*.ritz
sources = ["src", "lib"]

[build]
target = "x86_64-linux"
test = true

[[bin]]
name = "valet"
entry = "main::main"

# Dependencies - each gets namespaced import
[dependencies]
ritzlib = { path = "../ritz/ritzlib", sources = ["."] }
squeeze = { path = "../squeeze", sources = ["lib"] }
cryptosec = { path = "../cryptosec", sources = ["lib"] }
zeus = { path = "../zeus", sources = ["lib"] }
# test/test_tls.ritz imports ritzunit.assertions. build.py reads only
# [dependencies] — [dev-dependencies] is not a key it looks at — so a
# test-only dependency has to be declared here to resolve at all.
ritzunit = { path = "../ritzunit" }

[profile.debug]
opt-level = 2  # O0/O1 crash LLVM 20's DAG combiner (ubuntu bug)
debug = true

[profile.release]
opt-level = 2
debug = true
