[package]
name = "lexis"
version = "0.1.0"
description = "HTML5 and CSS parser for Tempest browser"

sources = ["lib", "src"]

[[bin]]
name = "lexis"
entry = "main::main"

[dependencies]
# src/ and lib/ import ritzlib.sys / ritzlib.string; without this the
# package does not build at all. iris and prism stay commented out —
# lexis core does not import them yet.
ritzlib = { path = "../ritz/ritzlib", sources = ["."] }
ritzunit = { path = "../ritzunit" }
# iris = { path = "../iris" }
# prism = { path = "../prism" }
