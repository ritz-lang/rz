[package]
name = "rllvm"
version = "0.1.0"
description = "LLVM IR subset to relocatable ELF64, encoded by razm (../razm/DESIGN.md)"

sources = ["src"]

# A workspace member, not a [workspace.exclude] entry: the gate must keep
# building rllvm under ritz1 and ritz1_selfhosted, which only membership
# gives. Its clang-oracle corpus runs from test.sh, so `./rz test rllvm`
# alone covers it (DESIGN.md "Tests").

[dependencies]
razm = { path = "../razm" }

# The `.ll` compiler: rllvm -c [flags] FILE.ll [-o OUT]
[[bin]]
name = "rllvm"
entry = "main::main"

# The parser's printer: rllvm-ir FILE.ll prints the module it parsed, for the
# round-trip tests.
[[bin]]
name = "rllvm-ir"
entry = "dump::main"
