[package]
name = "rld"
version = "0.1.0"
description = "x86-64 linker: relocatable ELF64 objects to executables (../razm/DESIGN.md \"rld\")"

sources = ["src"]

# A workspace member, as razm and rllvm are: the gate builds rld under ritz1
# and ritz1_selfhosted. Its ld.lld-oracle tests run from test.sh, so
# `./rz test rld` alone covers it (DESIGN.md "rld tests").

[dependencies]
razm = { path = "../razm" }

# The linker: rld [-o OUT] OBJ...
[[bin]]
name = "rld"
entry = "main::main"

# The reader, resolver, relaxation and writer, for the unit tests.
[[lib]]
name = "rld"
sources = ["src", "!src/main.ritz"]
