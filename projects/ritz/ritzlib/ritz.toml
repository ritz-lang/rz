# ritzlib, the Ritz standard library, as a package (docs/PACKAGES.md §5,
# AGAST #4864). Its modules sit directly in this directory, so `sources`
# is "."; tests/ is a separate test package with its own ritz.toml.
#
# A dependent names it as `ritzlib = { path = ".../ritz/ritzlib" }`; the
# `sources` below are the default, so it needs no `sources = ["."]`.
[package]
name = "ritzlib"
version = "0.1.0"
description = "The Ritz standard library"
sources = [".", "!tests"]

# `rz build ritz/ritzlib` archives every module as libritzlib.a.
[[lib]]
name = "ritzlib"
