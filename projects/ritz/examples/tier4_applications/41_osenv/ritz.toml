# Ritz Example 41: osenv
# Demonstrates: the idiomatic ritzlib.os.env API (AGAST #1462) — env_get
# returning Option<StrView>, env_iter as Span<StrView>, and env_must.

[package]
name = "osenv"
version = "0.1.0"
description = "Report environment lookups under ritzlib.os.env"

[[bin]]
name = "osenv"
path = "src/main.ritz"
