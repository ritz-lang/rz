# 🎭 Ritz Example 90: Global pointer indexing
# Demonstrates: indexed load/store through a global pointer variable
#
# Regression test for AGAST #1325.  `get_expr_type`'s EXPR_IDENT arm only
# consulted the *locals* table, so a global `var g: *i32` reported TYPE_I64
# rather than TYPE_PTR.  The OP_DEREF arm therefore never entered its
# `inner_type == TYPE_PTR` branch and every `*(g + i)` read fell through to
# the i64-load default — reading two i32 slots as one i64.  Stores were
# already correct, so the corruption was load-side and silent.

[package]
name = "global_ptr_index"
version = "0.1.0"

sources = ["src"]

[[bin]]
name = "global_ptr_index"
entry = "main::main"

[profile.debug]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
debug = false
