# Ritz Example 94: impl methods whose last statement is not an expression
#
# Regression test for AGAST #1573. ritz1's emit_impl_method only emitted an
# implicit `ret` when the method's last statement was a bare expression, so a
# non-void method ending in an `if`, a loop or an explicit `return` never got
# emit_fn's fallback, and its final block had no terminator.

[package]
name = "method_tail_return"
version = "0.1.0"

sources = ["src"]

[[bin]]
name = "method_tail_return"
entry = "main::main"

[profile.debug]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
debug = false
