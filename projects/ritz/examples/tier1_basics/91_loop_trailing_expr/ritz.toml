# 🎭 Ritz Example 91: Loop with trailing expression as final statement
# Demonstrates: functions ending in a loop whose body's last statement is
# a bare expression, with a non-void return type and no explicit return.
#
# Regression test for AGAST #1329.  Loop statements never cleared the
# tracked `last_expr_reg` on exit, and the implicit-return path read the
# field raw (bypassing the `last_expr_here` dominance guard added by
# AGAST #1309).  The result was `ret i64 %x` in the loop-exit block where
# %x is defined INSIDE the loop body — which does not dominate the exit
# block on the zero-iteration path.  clang 21's verifier rejects this
# ("Instruction does not dominate all uses!"); older clang accepted the
# invalid IR silently.

[package]
name = "loop_trailing_expr"
version = "0.1.0"

sources = ["src"]

[[bin]]
name = "loop_trailing_expr"
entry = "main::main"

[profile.debug]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
debug = false
