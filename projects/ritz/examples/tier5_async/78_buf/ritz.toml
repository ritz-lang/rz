# Ritz Example 78: buf
# Demonstrates: ritzlib.buf (AGAST #1457) — the Buffer cursor (peek, advance,
# match, read_until, read_quoted, save/restore, get_loc) and GrowBuf, via a
# small config tokenizer over stdin (read with gvec's vec_read_all_fd).
# Pins buf's current behaviour ahead of the StrView API cleanup (#1478).

[package]
name = "buf_demo"
version = "0.1.0"

[[bin]]
name = "buf_demo"
path = "src/main.ritz"
