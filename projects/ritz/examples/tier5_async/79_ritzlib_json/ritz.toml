# Ritz Example 79: ritzlib_json
# Demonstrates: ritzlib.json (AGAST #1459) — json_parse / json_parse2, the
# accessor API (get_field, get_index, *_len, get_string/number/bool, is_null),
# json_to_string re-emission, and json_error_message, over a document on stdin.

[package]
name = "json_walk"
version = "0.1.0"

[[bin]]
name = "json_walk"
path = "src/main.ritz"
