# Ritz Example 79: ritzlib_json
# Demonstrates: ritzlib.json (AGAST #1459, #1482) — json_parse(StrView) ->
# Result (and the deprecated json_parse2 wrapper), the Option-returning
# accessors (json_get_field, json_get_index, json_get_string/number/bool) plus
# json_is_null and *_len, json_to_string -> String re-emission, and
# json_error_message -> StrView, over a document on stdin.

[package]
name = "json_walk"
version = "0.1.0"

[[bin]]
name = "json_walk"
path = "src/main.ritz"
