# Ritz Example 79: ritzlib_json
# Demonstrates: ritzlib.json (AGAST #1459, #4690) -- json_parse(StrView) ->
# Result<Json, JsonError>, `match *v` on the Json enum with members() and
# items(), the Option-returning lookups (get_field, get_index, get_string,
# get_number, get_bool) plus is_null and array_len/object_len, to_string
# re-emission, and the JsonErrorKind and message of each parse error, over a
# document on stdin.

[package]
name = "json_walk"
version = "0.1.0"

[[bin]]
name = "json_walk"
path = "src/main.ritz"
