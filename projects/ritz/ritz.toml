[package]
name = "ritz"
version = "0.1.0-alpha"
description = "Ritz programming language - Systems programming with modern ergonomics"

# Bootstrap compiler (Python)
[[bin]]
name = "ritz0"
path = "ritz0/ritz0.py"

# Self-hosted compiler
[[bin]]
name = "ritz1"
path = "ritz1/compile.sh"

[profile.debug]
opt-level = 2   # LLVM 20 DAG combiner crashes at O0/O1
debug = true

[profile.release]
opt-level = 3
debug = false
lto = true
