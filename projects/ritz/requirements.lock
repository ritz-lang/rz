# Exact versions of every package CI installs for ritz0 and the tools, the
# requirements.txt + requirements-dev.txt closure on CI's Python 3.12 (AGAST #2300).
#
# The setup action installs with this file as constraints:
#   python -m pip install -r projects/ritz/requirements.txt \
#       -r projects/ritz/requirements-dev.txt -c projects/ritz/requirements.lock
# so CI changes packages only when this file does.  tools/python_deps.py (a
# main.yml step, so every gate runs it) reports any venv that differs; in CI
# it fails, on a gate host it only reports.
#
# Upgrading is deliberate: change a pin, install the result into a scratch
# venv, run ritz0/test_xdist_group_holds.py there, gate it, land it, and tell
# the hosts to re-run the install line above in their shared venv.
#
# pytest stays below 9.2 (see requirements.txt and #2251): pytest-xdist 3.8.0,
# still its latest release on 2026-11-18, splits xdist_groups on pytest 9.2.

# requirements.txt
llvmlite==0.50.0
pytest==9.1.1

# requirements-dev.txt
pytest-xdist==3.8.0
pyyaml==6.0.3
shellcheck-py==0.11.0.1

# pulled in by the above
execnet==2.1.2
