# The ritz0 pytest suite's budget (AGAST #3453, LARB review/5 tooling F1).
#
# Checked by tools/check_test_budget.py against `pytest --cost-report`
# (ritz0/cost_meter.py), in main.yml's "ritz0 unit tests" step: every gate
# and every CI run.  Units are CPU-seconds -- the test process plus every
# child it waited for -- not wall time, which on a loaded gate host ran 2-4x
# the CPU figure for the same file.
#
# Baseline, de56aed2 on huburght (load average ~25): 39,126 tests,
# 1,849 CPU-s, costliest file 81.5 CPU-s.  Limits sit ~1.3-1.5x above it so
# measurement noise can't turn the gate red; growth can.
#
# Over budget?  Batch the file and size its matrix to the rule
# (docs/TESTING.md, "What a ritz0 pytest case costs").  Raising a number
# here, or adding an override, needs a ticket that brings it back down.

[calibration]
# AGAST #3897: CPU-s aren't the same number on every host.  At ef9a7e2b the
# same suite measured 1,454.5 CPU-s on toffee and 2,347 on omegalisk (1.6x),
# so one cap meant ~40% headroom on one gate host and ~2% on the other.  The
# ritz0 step first times tools/cpu_calibrate.py's fixed workload on its host;
# check_test_budget.py divides every CPU figure by (that / reference_cpu_s).
# Caps here are therefore in toffee CPU-s: the workload's median CPU-s per
# copy on an idle toffee (Ryzen 5 7520U, 4 copies at once, the suite's -n
# auto there), six runs 0.720-0.755.  Change the workload and this must be
# re-measured on toffee, or every cap moves with it.
reference_cpu_s = 0.725

[suite]
# Normalised (toffee) CPU-s, see [calibration].  #3897, fresh on main at
# b87452c2 on toffee: 1,080.3 CPU-s raw, factor 0.990, 1,091.6 normalised
# (26,347 tests, all green).  Cap: +15%, rounded.  Cross-check: omegalisk's
# calibration read 1.254 (factor 1.73, 8 copies, rooms running), so #3759's
# 2,347 raw there is ~1,357 normalised, against toffee's 1,454.5 for the
# near-identical ef9a7e2b suite: 7% apart where raw CPU-s were 1.6x apart.
cpu_s = 1260.0
# Exact, never scaled: each test costs the xdist controller collection,
# dispatch and reporting however cheap it is (~150 s of a 493 s step).
# #3517-#3521 collapsed the eight matrix files: 39,126 -> 29,700 collected
# (#3557, at 2c597655).  Cap = count + #3453's headroom (41,000 / 39,126,
# ~4.8%), rounded up.  When a collapse removes tests, lower it again here
# and in test_check_test_budget.py's COLLECTED_AT_LAST_CAP.
# #3889: the suite had grown back to 31,171 (29 under the cap); 18 more matrix
# files as table rows took it to 26,329 on 8eddf0d6.  Cap: +5.2%.
# #4141 TEMPORARY raise (Aaron 2026-11-18): the suite reached the cap (27,647
# on 923ab16f, train cars over it), so 28,500 lets queued cars land while
# #4141 collapses more matrices; it goes back to 27,700 when that lands.
tests = 28500

[file]
default_cpu_s = 90.0
