# Marker registration for the tools/ test suite.
#
# Scoped to tools/ deliberately: projects/ritz has no pytest config at all,
# and adding one at the project root would move pytest's rootdir for
# `cd ritz0 && python -m pytest`, which is the command CI and every
# contributor runs. This file is only discovered when pytest is pointed at
# tools/, so it changes nothing else.
[pytest]
markers =
    unit: fast, no subprocess
    integration: shells out to the ritz0 compiler
