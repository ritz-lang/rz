# Buddhafinger - a modal terminal code editor for Linux and Harland.
#
# docs/BUDDHAFINGER_PROPOSAL.md is the design; AGAST epic #4782 the work.
# Built and tested with ritz1_selfhosted only, through `make -C
# projects/buddhafinger test` (see the Makefile); rz.toml's
# [workspace.exclude] keeps it out of the multi-compiler sweeps.

[package]
name = "buddhafinger"
version = "0.1.0"
description = "Modal terminal code editor for Linux and Harland"

# src/core/ is the editor core (buffer, screen, modes, commands): no terminal
# or OS I/O. src/platform/ holds the adapters that do that I/O. src/bench/
# is the benchmark harness (AGAST #4821), its own binary.
sources = ["src"]

[[bin]]
name = "buddhafinger"
entry = "main::main"
target = "x86_64-unknown-linux-gnu"
target_os = "linux"
link_runtime = true

# The benchmark workloads (bench/README.md): `make bench`, not the tests.
[[bin]]
name = "buddhafinger-bench"
entry = "bench.main::main"
target = "x86_64-unknown-linux-gnu"
target_os = "linux"
link_runtime = true

# Harland: the same editor core on the serial console (AGAST #4833), from
# its own entry module (main_harland.ritz: platform/harland). The ELF is
# build/debug/buddhafinger.harland.elf; installed as /bin/buddhafinger.
[[bin]]
name = "buddhafinger.harland"
entry = "main_harland::main"
target = "x86_64-unknown-none"
target_os = "harland"
freestanding = true
link_runtime = true

[bin."buddhafinger.harland".linker]
script = "../indium/user/linker_pie.ld"

[bin."buddhafinger.harland".flags]
pic = true

# Harland: the save contract (platform/save_contract.ritz, AGAST #4835) run
# through HarlandFiles on /var, from tools/test_harland_console.sh. The ELF
# is build/debug/bf-save-contract.harland.elf; installed as
# /bin/bf-save-contract.
[[bin]]
name = "bf-save-contract.harland"
entry = "main_save_contract::main"
target = "x86_64-unknown-none"
target_os = "harland"
freestanding = true
link_runtime = true

[bin."bf-save-contract.harland".linker]
script = "../indium/user/linker_pie.ld"

[bin."bf-save-contract.harland".flags]
pic = true

# The core and the adapters compiled as a library too, so a build compiles
# every module, not only those main.ritz reaches.
[[lib]]
name = "buddhafinger"

[dependencies]
ritzlib = { path = "../ritz/ritzlib" }

[test]
sources = ["test"]
