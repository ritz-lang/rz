# Buddhafinger - a modal terminal code editor for Linux and Harland.
#
# docs/BUDDHAFINGER_PROPOSAL.md is the design; AGAST epic #4782 the work.
# Built and tested with ritz1_selfhosted only, through `make -C
# projects/buddhafinger test` (see the Makefile); rz.toml's
# [workspace.exclude] keeps it out of the multi-compiler sweeps.

[package]
name = "buddhafinger"
version = "0.1.0"
description = "Modal terminal code editor for Linux and Harland"

# src/core/ is the editor core (buffer, screen, modes, commands): no terminal
# or OS I/O. src/platform/ holds the adapters that do that I/O.
sources = ["src"]

[[bin]]
name = "buddhafinger"
entry = "main::main"
target = "x86_64-unknown-linux-gnu"
target_os = "linux"
link_runtime = true

# The core and the adapters compiled as a library too, so a build compiles
# every module, not only those main.ritz reaches.
[[lib]]
name = "buddhafinger"

[dependencies]
ritzlib = { path = "../ritz/ritzlib" }

[test]
sources = ["test"]
