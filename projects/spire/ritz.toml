[package]
name = "spire"
version = "0.1.0"
description = "MVRSPT Web Framework for Ritz"

sources = ["lib", "test"]

[[lib]]
name = "spire"
# Package sources include test/, which is not library code.
sources = ["lib"]

[[test]]
name = "spire-tests"
sources = ["test"]
entry = "test::main"

[dependencies]
ritzlib = { path = "../ritz/ritzlib", sources = ["."] }
http = { path = "../http", sources = ["lib"] }
mausoleum = { path = "../mausoleum", sources = ["lib"] }
tome = { path = "../tome", sources = ["lib"] }
# Self-reference for internal imports when used as dependency
spire = { path = ".", sources = ["lib"] }
