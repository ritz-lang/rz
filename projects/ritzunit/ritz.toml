[package]
name = "ritzunit"
version = "0.1.0"
authors = ["Aaron Sinclair <aaron.sinclair@bettercomp.com>"]
description = "A modern unit testing framework for Ritz projects"

# RFC #109: source discovery — directory expands to **/*.ritz under src/.
sources = ["src"]

# No [[bin]]: ritzunit is not a program on its own. It is the `main` of every
# test binary: the test harness links src/bin_main.ritz and the runner with a
# test file compiled in test mode (LANGUAGE_SPEC.md §17.1).

[[lib]]
name = "ritzunit"

[build]
target = "x86_64-linux"
# Nothing to build on its own (see above); every test of every package
# compiles and links these sources, ritzunit's own test/ included.
test_only = true

[dependencies]
# ritzlib is a directory of .ritz modules at the dep path (no nested src/),
# so we override the default sources=["src"] to point at the dep root.
ritzlib = { path = "../ritz/ritzlib", sources = ["."] }
# Self-reference: the runner imports its siblings as `ritzunit.<module>`, so
# they resolve the same way inside a test binary of any other package.
ritzunit = { path = ".", sources = ["src"] }
