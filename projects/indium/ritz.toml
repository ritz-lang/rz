# Indium Distribution - Ritz Build Configuration
#
# Indium is the distribution built on the Harland microkernel.
# This config defines userspace programs that run on Harland.

[package]
name = "indium"
version = "0.1.0"
description = "Distribution built on the Harland microkernel"

# Source directories for import resolution
sources = ["user"]

# The frame ring, wait and link layouts a ring-1 driver and the ring-2
# network service compile (projects/harland/driver_abi, AGAST #4718), and
# the virtqueue and feature negotiation a ring-1 virtio driver compiles
# (projects/harland/virtio_abi, AGAST #4732).
[dependencies]
driver_abi = { path = "../harland/driver_abi" }
virtio_abi = { path = "../harland/virtio_abi" }
# The app-exchange layout and harland's ring-3 net library that ping,
# udp-send and udp-recv link (docs/RING2_NET.md "Ring-3 tools", AGAST #4751).
net_abi = { path = "../harland/net_abi" }
libnet = { path = "../harland/libnet" }

# ============================================================================
# Userspace Programs (kernel development helpers - no runtime)
# ============================================================================

# Minimal syscall test (for kernel development)
[[bin]]
name = "minimal_syscall"
entry = "minimal_syscall::main"
target = "x86_64-unknown-none"
sources = ["user"]
freestanding = true

[bin.minimal_syscall.linker]
script = "user/linker.ld"

[bin.minimal_syscall.flags]
code-model = "large"

# Portable getpid test (for kernel development)
[[bin]]
name = "portable_getpid"
entry = "portable_getpid::main"
target = "x86_64-unknown-none"
target_os = "harland"
sources = ["user"]
freestanding = true

[bin.portable_getpid.linker]
script = "user/linker.ld"

[bin.portable_getpid.flags]
code-model = "large"

