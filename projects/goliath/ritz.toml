[package]
name = "goliath"
version = "0.1.0"
description = "Content-addressable filesystem for Harland"

# Library sources
sources = ["src"]

# Dependencies - using RITZ_PATH flat structure
[dependencies]
cryptosec = { path = "../cryptosec" }  # SHA-256
# squeeze = { path = "../squeeze" }      # LZ4 compression (G4)

# Standalone sanity-check binary
[[bin]]
name = "goliath"
entry = "main::main"

# Library definition. main.ritz belongs to the binary above.
[[lib]]
name = "goliath"
sources = ["src", "!src/main.ritz"]
