[package]
name = "tome"
version = "0.1.0"
description = "In-memory data store for Ritz. Think Redis, but embedded."
sources = ["lib", "test", "bin"]

# Binaries
[[bin]]
name = "tome-server"
entry = "tome_server::main"

[[bin]]
name = "tome-cli"
entry = "tome_cli::main"

# Dependencies - use flat ecosystem via RITZ_PATH
[dependencies]
# ritzlib is found automatically via RITZ_PATH

[profile.debug]
opt-level = 2
debug = true

[profile.release]
opt-level = 2
debug = true
