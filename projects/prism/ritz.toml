[package]
name = "prism"
version = "0.1.0"
description = "Display server and window compositor for Harland"

# Only prism's own tree.  angelo is a dependency and prism imports it as
# `angelo.*`; listing ../angelo/src here made a bare `import types` silently
# bind angelo's font types (prism/src/types/ is a directory, with no
# types.ritz) instead of failing to resolve (#3572).
sources = ["src"]

# Display server entry point: for now a compositing self-check on the mock backend
[[bin]]
name = "prism"
entry = "main::main"

# Minimal demo binary for testing graphics on Harland
[[bin]]
name = "prism_demo"
entry = "demo::main"
target = "x86_64-unknown-none"
target_os = "harland"
freestanding = true
link_runtime = true

[bin.prism_demo.linker]
script = "linker_pie.ld"

[bin.prism_demo.flags]
pic = true

# Graphical Hello World demo with bitmap font
[[bin]]
name = "hello_gfx"
entry = "hello_gfx::main"
target = "x86_64-unknown-none"
target_os = "harland"
freestanding = true
link_runtime = true

[bin.hello_gfx.linker]
script = "linker_pie.ld"

[bin.hello_gfx.flags]
pic = true

[dependencies]
angelo = { path = "../angelo" }
