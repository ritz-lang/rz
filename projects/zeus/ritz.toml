[package]
name = "zeus"
version = "0.1.0"
description = "Zero-copy process runner with shared memory ring buffer IPC"

sources = ["src", "lib", "test", "examples"]

[[bin]]
name = "zeus"
entry = "main::main"

[[bin]]
name = "test_client"
entry = "test_client::main"
sources = ["examples"]

[[bin]]
name = "echo_worker"
entry = "echo_worker::main"
sources = ["examples"]

[[lib]]
name = "zeus"
sources = ["lib"]

# Dependencies
[dependencies]
ritzlib = { path = "../ritz/ritzlib", sources = ["."] }
# Self-reference for internal imports when used as dependency
zeus = { path = ".", sources = ["lib", "examples"] }

[profile.debug]
opt-level = 2
debug = true

[profile.release]
opt-level = 2
debug = true
