[package]
name = "angelo"
version = "0.1.0"
description = "Font loading and rendering library for Prism"

sources = ["src"]

[[bin]]
name = "angelo-test"
entry = "main::main"

[[bin]]
name = "simple-test"
entry = "simple_test::main"

# Demo programs. Each renders "Hello" text from tests/fixtures/aadhunik.ttf
# into an image file in the current directory. They are [[bin]]s so the
# `rz build --all` gate compiles them: as loose files in no build target
# they rotted unnoticed (AGAST #1952).
[[bin]]
name = "hello-world"
entry = "hello_world::main"

# Was prism/tools/angelo_render_test.ritz. It uses nothing from prism, and
# prism's angelo dependency is disabled, so it could not be a prism target.
[[bin]]
name = "render-demo"
entry = "render_demo::main"

# Future: when we have dependencies
# [dependencies]
# prism = { path = "../prism" }  # For shared types (Rect, Point, etc.)
