[package]
name = "razm"
version = "0.1.0"
description = "x86-64 assembler: AT&T text to relocatable ELF64 (DESIGN.md)"

sources = ["src"]

# A workspace member, not a [workspace.exclude] entry: the gate must keep
# building razm under ritz1 and ritz1_selfhosted, which only membership
# gives. It costs `rz build --all` six small modules. Its oracle tests run
# from test.sh, so `./rz test razm` alone covers it (DESIGN.md "Tests").

# The `.s` driver: razm --64 -o OUT FILE.s
[[bin]]
name = "razm"
entry = "main::main"

# encode, parse and the ELF writer, for rllvm. main.ritz is the bin's.
[[lib]]
name = "razm"
sources = ["src", "!src/main.ritz"]
