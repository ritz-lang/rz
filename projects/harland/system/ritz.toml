# Harland system programs - Ritz Build Configuration
#
# The programs the kernel spawns (docs/RING2_NET.md "Placement", decision
# D4, AGAST #4736): kernel-related code lives in Harland, not in the
# indium distribution, but they are ordinary ring-3 ELFs on the same
# freestanding user target and linker script as indium's bins. The indium
# image build installs them in /bin (projects/indium/initramfs.pkgs).

[package]
name = "system"
version = "0.1.0"
description = "Harland's kernel-spawned programs: /bin/netd, the network service with the NIC's driver inside it (AGAST #4743, #4875)"

sources = ["src"]

# The boot record, frame ring, wait and link layouts (driver_abi); the
# virtqueue the nic library runs on (virtio_abi); the NIC
# interface and its virtio-net implementation (nic, D9: the driver is a
# library linked into netd); netd's protocols (netstack), and the app
# exchange's AppDesc (net_abi) and ring halves (libnet.ring, the protocol
# both ends of an exchange run).
[dependencies]
driver_abi = { path = "../driver_abi" }
nic = { path = "../nic" }
virtio_abi = { path = "../virtio_abi" }
netstack = { path = "../netstack" }
net_abi = { path = "../net_abi" }
libnet = { path = "../libnet" }

# ============================================================================
# /bin/netd: the network service and the NIC's driver in one CPL-3 process
# (docs/RING2_NET.md "Drivers inside netd (D9)", decisions D3/D4/D9). The
# kernel spawns it on every boot with a translated DMA domain (kernel
# net/ring1.ritz). src/netsvc.ritz (the stack, generic over trait Nic) and
# src/seat.ritz (the kernel seat's half until the handoff) are its
# host-tested halves (test/test_netsvc.ritz, test/test_seat.ritz).
# ============================================================================

[[bin]]
name = "netd"
entry = "netd::main"
target = "x86_64-unknown-none"
target_os = "harland"
sources = ["src"]
freestanding = true
link_runtime = true

[bin.netd.linker]
script = "../../indium/user/linker_pie.ld"

[bin.netd.flags]
pic = true
