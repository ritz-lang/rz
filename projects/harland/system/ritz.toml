# Harland system programs - Ritz Build Configuration
#
# The programs the kernel spawns (docs/RING2_NET.md "Placement", decision
# D4, AGAST #4736): kernel-related code lives in Harland, not in the
# indium distribution, but they are ordinary ring-3 ELFs on the same
# freestanding user target and linker script as indium's bins. The indium
# image build installs them in /bin (projects/indium/initramfs.pkgs).

[package]
name = "system"
version = "0.1.0"
description = "Harland's kernel-spawned programs: the ring-1 virtio-net driver (AGAST #4734) and the ring-2 network service netd (AGAST #4743)"

sources = ["src"]

# The boot record, frame ring, wait and link layouts (driver_abi) and the
# virtqueue and feature negotiation (virtio_abi) the kernel compiles too;
# netd's protocols (netstack), and the app exchange's AppDesc (net_abi)
# and ring halves (libnet.ring, the protocol both ends of an exchange run).
[dependencies]
driver_abi = { path = "../driver_abi" }
virtio_abi = { path = "../virtio_abi" }
netstack = { path = "../netstack" }
net_abi = { path = "../net_abi" }
libnet = { path = "../libnet" }

# ============================================================================
# /bin/virtio-net: the ring-1 virtio-net driver (docs/RING1_DRIVER.md
# section 8). The cutover (AGAST #4735, kernel net/ring1.ritz) spawns it on
# every boot with a translated DMA domain. src/vnet.ritz is its host-tested half
# (test/test_vnet.ritz).
# ============================================================================

[[bin]]
name = "virtio-net"
entry = "virtio_net::main"
target = "x86_64-unknown-none"
target_os = "harland"
sources = ["src"]
freestanding = true
link_runtime = true

[bin.virtio-net.linker]
script = "../../indium/user/linker_pie.ld"

[bin.virtio-net.flags]
pic = true

# ============================================================================
# /bin/netd: the ring-2 network service (docs/RING2_NET.md, decisions D3/D4).
# Built, not spawned: the frame-seat handoff (AGAST #4744) spawns it on a
# translating boot. src/netsvc.ritz is its host-tested half
# (test/test_netsvc.ritz).
# ============================================================================

[[bin]]
name = "netd"
entry = "netd::main"
target = "x86_64-unknown-none"
target_os = "harland"
sources = ["src"]
freestanding = true
link_runtime = true

[bin.netd.linker]
script = "../../indium/user/linker_pie.ld"

[bin.netd.flags]
pic = true
