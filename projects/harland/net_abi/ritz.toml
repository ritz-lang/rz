[package]
name = "net_abi"
version = "0.1.0"
description = "Harland net ABI: AppDesc, the request and event kinds and the ring-3 app-exchange layout the network service and libnet share (AGAST #4747)"

# A library only, on the boot_abi / driver_abi pattern (docs/RING2_NET.md,
# "Where the code lives" and "Ring-3 app exchange"): structs and constants,
# no kernel imports, no ritzlib imports and no driver_abi import, so netd,
# libnet and a later Linux port all compile the same bytes.
# test/test_layout.ritz pins sizeof, every field offset, every kind and
# every region offset against the doc's tables.
sources = ["src"]

[[lib]]
name = "net_abi"
