[package]
name = "netstack"
version = "0.1.0"
description = "Harland network protocol leaf package: Ethernet demux, IPv4 and UDP parse and build with checksums (AGAST #4738), the RFC 2131 DHCP client (AGAST #4741), docs/RING2_NET.md"

# The port of docs/stack_example/ (RING2_NET.md "Where the code lives"): the
# protocol code /bin/netd runs, as pure functions over byte spans. No kernel
# imports and no ritzlib imports, on the boot_abi / driver_abi pattern, so
# netd, the host tests and a later Linux port compile the same bytes. It
# reads the link snapshot's layout (NetInfo) from driver_abi and nothing
# else.
sources = ["src"]

[dependencies]
driver_abi = { path = "../driver_abi" }

[[lib]]
name = "netstack"
