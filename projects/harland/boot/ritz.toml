[package]
name = "harland_boot"
version = "0.1.0"

sources = ["src"]

[[bin]]
name = "harland_boot"
# Not a standalone target (rz.toml excludes the package): harland's own
# ritz.toml builds this source as [[bin]] bootx64, a UEFI application whose
# `entry = "main::efi_main"` selects the PE entry symbol. Built standalone
# here it is a hosted ELF whose runtime wants `main`, which this file does
# not define, so name the file rather than claim an entry function.
path = "src/main.ritz"
