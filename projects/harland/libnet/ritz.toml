[package]
name = "libnet"
version = "0.1.0"
description = "Harland ring-3 net library: net_bind, net_send_to, net_recv_from, net_ping, net_close on the app exchange (AGAST #4750, docs/RING2_NET.md \"Ring-3 app exchange\" and \"Userspace interface\")"

# A ring-3 application library, laid out like driver_abi: src/ring.ritz is
# the SPSC protocol over net_abi's AppDesc records (the frame-ring
# producer/consumer shape, one layer up), src/client.ritz is the five
# net_* calls and the per-handle state they share. Depends on net_abi for
# the AppDesc layout and on driver_abi only for the SpscCtrl type the two
# control blocks are built from (net_abi's own comment: "the two control
# blocks are driver_abi's SpscCtrl bytes"); it does not duplicate that
# struct. test/test_ring.ritz pins the ring protocol the way
# driver_abi/test/test_spsc.ritz does; test/test_client.ritz hosts the
# five calls against a fake service ring (no real NetAttach/ShmMap: those
# syscalls are not in the kernel yet, so this package stops at the
# AppDesc bytes and takes an already-mapped region).
sources = ["src"]

[dependencies]
net_abi = { path = "../net_abi" }
driver_abi = { path = "../driver_abi" }

[[lib]]
name = "libnet"
