# Harland NIC library - Ritz Build Configuration
#
# The NIC interface netd's stack runs on and its implementations (decision
# D9, docs/RING2_NET.md "Drivers inside netd (D9)", AGAST #4875): one CPL-3
# process owns the NIC and the stack, and the driver is a library linked
# into /bin/netd behind `trait Nic`.

[package]
name = "nic"
version = "0.1.0"
description = "Harland NIC library: trait Nic, the virtio-net implementation linked into /bin/netd, and a loopback Nic for host tests (D9, AGAST #4875)"

# A leaf library on the virtio_abi pattern: no kernel imports, and no
# syscalls. netd maps the device's windows and allocates its DMA runs and
# passes them in; this package programs the registers and runs the queues.
# src/nic.ritz is the interface, src/virtio.ritz the virtio-net
# implementation (moved from system/src/virtio_net.ritz and vnet.ritz), and
# src/loopback.ritz a Nic over plain memory that netd's host tests drive.
# test/test_virtio.ritz and test/test_loopback.ritz are their host tests.
sources = ["src"]

[dependencies]
driver_abi = { path = "../driver_abi" }
virtio_abi = { path = "../virtio_abi" }

[[lib]]
name = "nic"
