[package]
name = "driver_abi"
version = "0.1.0"
description = "Harland driver ABI: frame ring, wait and link layouts the kernel and a ring-1 driver share (AGAST #4718)"

# A library only, on the boot_abi pattern (docs/RING1_DRIVER.md section 6):
# structs and constants, no kernel imports and no ritzlib imports, so the
# kernel, the ring-1 driver and a later Linux port all compile the same
# bytes. test/test_layout.ritz pins sizeof and every field offset against
# the doc's tables.
sources = ["src"]

[[lib]]
name = "driver_abi"
