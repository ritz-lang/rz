[package]
name = "boot_abi"
version = "0.1.0"
description = "Harland boot ABI: what the UEFI loader and the kernel both compile (AGAST #4578)"

# A library only: harland's ritz.toml depends on it for both [[bin]] harland
# (the kernel) and [[bin]] bootx64 (the UEFI loader). Every module imports
# nothing outside this package except ritzlib.fmt.digits, which imports
# nothing, so it builds freestanding for both targets and hosted for
# test/test_layout.ritz, which pins the handoff and ELF field offsets.
sources = ["src"]

[[lib]]
name = "boot_abi"
