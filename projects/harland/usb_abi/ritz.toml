[package]
name = "usb_abi"
version = "0.1.0"
description = "Harland USB ABI: xHCI register, TRB and context layouts, the TRB and event rings, the USB descriptor parser and endpoint intervals (AGAST #4887, docs/USB.md)"

# A library only, on the virtio_abi pattern (docs/USB.md "Code layout"): no
# kernel imports and no ritzlib imports, so the kernel's xHCI driver
# (kernel/src/drivers/usb/) and a later CPL-3 usbd compile the same bytes.
# Allocation and register access are the caller's: the rings and contexts
# lie over memory the caller allocated and zeroed and can name both ways
# (the CPU's address and the device's), and every MMIO read and write stays
# in the driver. test/ holds the host tests: register decode, TRB encode,
# ring wrap and cycle toggle, event dequeue, context sizing, descriptors
# (good and truncated) and intervals per speed.
sources = ["src"]

[[lib]]
name = "usb_abi"
