[package]
name = "virtio_abi"
version = "0.1.0"
description = "Harland virtio ABI: the transport-independent split virtqueue, the TX buffer rule and feature negotiation (AGAST #4732)"

# A library only, on the boot_abi / driver_abi pattern (docs/RING1_DRIVER.md
# section 6, last paragraph): no kernel imports and no ritzlib imports, so
# the in-kernel blk, input and net drivers and the ring-1 virtio-net driver
# compile the same bytes. Allocation and register access are the caller's:
# virtq_init takes ring memory the caller allocated and zeroed, and the
# notify write and the feature-word reads and writes stay in the transport
# (kernel/src/drivers/virtio/common.ritz). test/test_virtq.ritz is the host
# test of the ring layout, the index math, the free list, the TX rule and
# the feature negotiation.
sources = ["src"]

[[lib]]
name = "virtio_abi"
