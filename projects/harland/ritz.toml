# Harland Microkernel - Ritz Build Configuration
#
# This builds the kernel and UEFI bootloader only.
# Userspace programs are in the indium project.

[package]
name = "harland"
version = "0.1.0"
description = "A microkernel written in Ritz, designed for portability and clean syscall abstraction"

# Source directories for import resolution
sources = ["kernel/src"]

# The kernel's filesystem is goliath, bound by kernel/src/fs/kfs.ritz;
# goliath hashes with cryptosec's SHA-256 (AGAST #1881).
[dependencies]
goliath = { path = "../goliath" }
cryptosec = { path = "../cryptosec" }
# What the kernel and the UEFI loader (bootx64) share, declared once: the
# boot handoff, ELF64 layouts, port I/O and the polled COM1 driver (AGAST
# #4578).
boot_abi = { path = "boot_abi" }

# ============================================================================
# Kernel Build
# ============================================================================

[[bin]]
name = "harland"
entry = "main::kernel_main"
target = "x86_64-none-elf"
freestanding = true

[bin.harland.linker]
script = "kernel/linker.ld"

[bin.harland.flags]
no-red-zone = true
code-model = "kernel"
# Stack canaries (AGAST #2590): kernel/src/stack_protector.ritz defines the
# guard and the failure handler; boot.s seeds the guard.
stack-protector = true

# Additional assembly files to link
[bin.harland.asm]
files = [
    "kernel/boot.s",
    "kernel/isr_stubs.s",
    "kernel/ap_trampoline.s",
    "kernel/syscall_entry.s",
    "kernel/proc_switch.s",
    "kernel/user_program.s"
]

# ============================================================================
# UEFI Bootloader Build
# ============================================================================

[[bin]]
name = "bootx64"
entry = "main::efi_main"
target = "x86_64-unknown-uefi"
freestanding = true
sources = ["boot/src"]

[bin.bootx64.linker]
script = "boot/linker.ld"

# ============================================================================
# Hardware-inventory UEFI app (AGAST #3406)
# ============================================================================
# HWINV.EFI dumps ACPI, SMBIOS, the memory map, PCI, GOP/EDID and firmware
# facts to \INVENTORY\<timestamp>\ on the stick it booted from.
# inventory/esp_image.py builds the stick image; inventory/test.sh boots it.

[[bin]]
name = "hwinv"
entry = "main::efi_main"
target = "x86_64-unknown-uefi"
freestanding = true
sources = ["inventory/src"]
