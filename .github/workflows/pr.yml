name: PR Validation
on: [pull_request]

# Pinned for the same reason main.yml is (AGAST #1308): build.py calls bare
# `clang`, and an unpinned clang makes the regression allowlists mean
# different things on different machines. Keep CLANG_VERSION in step with
# main.yml and projects/ritz/docs/TOOLCHAIN.md.
env:
  CLANG_VERSION: '21'

jobs:
  affected:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.find.outputs.projects }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find affected projects
        id: find
        run: |
          # Find changed projects
          changed=$(git diff --name-only origin/main | \
            grep "^projects/" | \
            cut -d/ -f2 | \
            sort -u | \
            jq -R -s -c 'split("\n") | map(select(. != ""))')
          echo "projects=$changed" >> $GITHUB_OUTPUT
          echo "Affected projects: $changed"

  test:
    needs: affected
    if: needs.affected.outputs.projects != '[]'
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.affected.outputs.projects) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install toolchain
        uses: ./.github/actions/install-toolchain
        with:
          clang-version: ${{ env.CLANG_VERSION }}

      - name: Install ritz0 dependencies
        run: python -m pip install --upgrade pip -r projects/ritz/requirements.txt

      # Build and test through `rz` rather than the project's Makefile. rz
      # resolves dependencies and RITZ_PATH from ritz.toml; per-project
      # Makefiles are thin wrappers around it and several had drifted into
      # calling deleted scripts or silently swallowing errors.
      - name: Build
        run: ./rz build ${{ matrix.project }}

      - name: Test
        run: ./rz test ${{ matrix.project }}

  # Advisory only - ritz-lint needs the authenticated `claude` CLI, which CI
  # runners do not have. Never gate a merge on it.
  lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run ritz-lint (advisory)
        run: |
          if ! command -v claude >/dev/null 2>&1; then
            echo "::notice::claude CLI unavailable on CI runners - skipping ritz-lint."
            exit 0
          fi
          if [ -f projects/larb/tools/ritz-lint/ritz_lint.py ]; then
            python projects/larb/tools/ritz-lint/ritz_lint.py projects/
          else
            echo "ritz-lint not found, skipping"
          fi
