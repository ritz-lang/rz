name: Main Branch Validation
on:
  push:
    branches: [main]

# CI drives the workspace through `./rz`, the same entry point developers use.
#
# It used to loop over projects/*/ running `make build` / `make test`. That
# predates db2402e ("Remove 40 legacy build scripts"), which moved every
# project onto `rz build` / `rz test`. The loop kept several projects green by
# accident: some Makefiles invoked scripts deleted in that commit, one had a
# phony target colliding with its output directory so `build` only ran mkdir,
# and another swallowed compiler errors with `2>/dev/null || true`. Calling rz
# directly means CI exercises the real build graph from ritz.toml.

# The LLVM toolchain is PINNED. It used to be "whatever clang ubuntu-latest
# happens to ship", which meant the regression allowlists described a
# different compiler on every machine. Concretely (AGAST #1308): on the same
# commit, stage 3 was 42 passed locally against clang 21 and 50 passed in CI
# against the runner's older clang, and eight examples sat in the ritz1
# allowlist labelled "cannot compile" when the truth was "ritz1 emits IR that
# violates dominance and only the newer verifier rejects it".
#
# We pin FORWARD, to the newest clang we test against, not back to the
# runner's default. Pinning back would have been stable and quiet, and would
# have been the wrong call: a permissive verifier accepting dominance-
# violating IR does not make the IR valid, it makes a real codegen bug
# invisible until the toolchain moves under us. Pinning forward turns those
# bugs into failures we can file and fix. See RITZ_VERIFY_IR below, which is
# the durable version of the same idea.
env:
  # Keep in sync with projects/ritz/docs/TOOLCHAIN.md and the local
  # requirement documented there.
  CLANG_VERSION: '21'

# build-all / test-all GATE. They had been red for 12+ consecutive runs —
# a permanently-red gate is a disabled gate (AGAST #1324). The fix is NOT
# continue-on-error (that is a green-looking non-gate); instead `rz` consults
# the explicit, per-project [ci.known_failing.build] list in rz.toml (there
# is deliberately no .test list — a test-side excuse would excuse behavioural
# failure, which scripts/regression.sh's house rule forbids; the test sweep
# consults the build list, since a project that cannot compile fails its
# tests for that same compile reason). Excluded projects still build/test
# with full output and are named in the job summary with their AGAST task;
# an excluded project that starts PASSING fails the job until it is delisted.
# That strict-xpass rule forces stale entries out — it does not prevent new
# entries being added, so treat additions to the list as review-worthy.
jobs:
  build-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install toolchain
        uses: ./.github/actions/install-toolchain
        with:
          clang-version: ${{ env.CLANG_VERSION }}

      - name: Install ritz0 dependencies
        run: python -m pip install --upgrade pip -r projects/ritz/requirements.txt

      - name: Build workspace
        run: ./rz build --all

  test-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install toolchain
        uses: ./.github/actions/install-toolchain
        with:
          clang-version: ${{ env.CLANG_VERSION }}

      - name: Install ritz0 dependencies
        run: python -m pip install --upgrade pip -r projects/ritz/requirements.txt

      - name: Test workspace
        run: ./rz test --all

  # The bootstrap chain is the language's acceptance criterion:
  #   1. compile examples with ritz0        (Python-hosted compiler)
  #   2. compile the compiler with ritz0    -> ritz1
  #   3. compile examples with ritz1
  #   4. compile the compiler with ritz1    -> self-hosted ritz
  #   5. compile examples with self-hosted ritz
  # Two gates, and they answer different questions:
  #
  #   make matrix-full        50 single-file test_issue_*.ritz repros compiled
  #                           and run by all three compilers. Narrow but deep.
  #
  #   scripts/regression.sh   the corpus. Each of the 85 examples is built by
  #                           ritz0 to establish a baseline (stdout + exit
  #                           code), then rebuilt by ritz1 and by
  #                           ritz1_selfhosted and *executed*, with both
  #                           compared against that baseline. This is what
  #                           steps 3 and 5 above actually mean.
  #
  # Neither subsumes the other: matrix-full covers language features the
  # corpus does not exercise, and regression.sh covers multi-module programs
  # the repros do not. Both must pass.
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install toolchain
        uses: ./.github/actions/install-toolchain
        with:
          clang-version: ${{ env.CLANG_VERSION }}

      - name: Install ritz0 dependencies
        run: python -m pip install --upgrade pip -r projects/ritz/requirements.txt

      # AGAST #1311. Compile every fenced ```ritz block in the language
      # documentation with ritz0, the reference compiler.
      #
      # This deliberately does NOT live in the lint-all job. lint-all is
      # `continue-on-error: true` and no-ops entirely when the `claude` CLI
      # is absent, which is always, on CI. Putting a real check there would
      # produce a green tick that asserts nothing — the exact failure mode
      # this task exists to remove. It gates here, next to the other things
      # that are allowed to fail the build.
      #
      # Runs before the unit tests because it is ~15s and catches the class
      # of breakage (a doc teaching syntax the compiler rejects) that is
      # cheapest to read about first.
      - name: Documentation examples compile
        run: make check-doc-examples
        working-directory: projects/ritz

      - name: tools/ unit tests
        run: make tools-unit
        working-directory: projects/ritz

      - name: ritz0 unit tests
        run: python -m pytest -q
        working-directory: projects/ritz/ritz0

      # Both steps carry an explicit timeout. GitHub's default is the job-level
      # six hours, which is not a useful bound for a test step: a deadlocked
      # run burns a runner for an afternoon and reports nothing. These budgets
      # are roughly 3x the observed cost (matrix ~72s, differential ~6m25s), so
      # tripping one means something is wedged, not merely slow.
      - name: Bootstrap chain + regression matrix
        run: make matrix-full
        working-directory: projects/ritz
        timeout-minutes: 20
        env:
          RITZ_VERIFY_IR: '1'

      - name: Differential corpus regression (ritz0 vs ritz1 vs self-hosted)
        run: ./scripts/regression.sh
        working-directory: projects/ritz
        timeout-minutes: 25
        # Run the LLVM verifier on every module we emit, before handing it to
        # clang. Pinning the toolchain makes the allowlist mean one thing;
        # this makes it stop depending on the toolchain at all. Invalid IR now
        # fails at the point of emission with the offending function named,
        # rather than surviving until some future clang tightens its verifier
        # and turns a two-year-old codegen bug into a mystery CI break.
        env:
          RITZ_VERIFY_IR: '1'

  # ritz-lint is an AI-assisted reviewer: it shells out to the `claude` CLI and
  # needs an authenticated subscription. That is not available to CI runners, so
  # this job is advisory only and must never gate a merge. Run it locally with
  #   python projects/larb/tools/ritz-lint/ritz_lint.py projects/
  #
  # Nothing that must actually pass belongs in this job. The documentation
  # example checker (AGAST #1311) gates in `bootstrap` for that reason.
  lint-all:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run ritz-lint on all (advisory)
        run: |
          if ! command -v claude >/dev/null 2>&1; then
            echo "::notice::claude CLI unavailable on CI runners - skipping ritz-lint."
            exit 0
          fi
          if [ -f projects/larb/tools/ritz-lint/ritz_lint.py ]; then
            python projects/larb/tools/ritz-lint/ritz_lint.py projects/
          fi
