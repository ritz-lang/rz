name: Main Branch Validation
on:
  push:
    branches: [main]
  # AGAST #1327: allow running this workflow against a branch, so a job can
  # be observed before a merge rather than only after it.
  workflow_dispatch:

# This is the only workflow (AGAST #1838). Work lands by `git merge --ff-only`
# on a local machine, never through a pull request, so the pull_request
# workflow pr.yml never ran (last run 2026-09-04) and was deleted, along with
# the advisory lint-all job (continue-on-error, and a no-op without the
# `claude` CLI, i.e. always). ritz-lint is a local pre-commit hook:
# projects/ritz/tools/ritz-lint/install-hook.sh.
#
# What runs BEFORE a merge is the room gate, `make -C projects/ritz ci-local`
# over this file's build-all, test-all and bootstrap jobs (tools/ci_local.py,
# invoked by .claude/skills/rz-iterate/run-gate.sh; test-all since AGAST
# #3969). See "Gate coverage" in .claude/skills/rz-iterate/SKILL.md.

# CI drives the workspace through `./rz`, the same entry point developers use.
#
# It used to loop over projects/*/ running `make build` / `make test`. That
# predates db2402e ("Remove 40 legacy build scripts"), which moved every
# project onto `rz build` / `rz test`. The loop kept several projects green by
# accident: some Makefiles invoked scripts deleted in that commit, one had a
# phony target colliding with its output directory so `build` only ran mkdir,
# and another swallowed compiler errors with `2>/dev/null || true`. Calling rz
# directly means CI exercises the real build graph from ritz.toml.

# The LLVM toolchain is PINNED. It used to be "whatever clang ubuntu-latest
# happens to ship", which meant the regression allowlists described a
# different compiler on every machine. Concretely (AGAST #1308): on the same
# commit, stage 3 was 42 passed locally against clang 21 and 50 passed in CI
# against the runner's older clang, and eight examples sat in the ritz1
# allowlist labelled "cannot compile" when the truth was "ritz1 emits IR that
# violates dominance and only the newer verifier rejects it".
#
# We pin FORWARD, to the newest clang we test against, not back to the
# runner's default. Pinning back would have been stable and quiet, and would
# have been the wrong call: a permissive verifier accepting dominance-
# violating IR does not make the IR valid, it makes a real codegen bug
# invisible until the toolchain moves under us. Pinning forward turns those
# bugs into failures we can file and fix. See RITZ_VERIFY_IR below, which is
# the durable version of the same idea.
env:
  # The one place CI's clang is pinned; .github/actions/setup installs it.
  # Keep in sync with projects/ritz/docs/TOOLCHAIN.md and the local
  # requirement documented there.
  CLANG_VERSION: '21'

# build-all / test-all GATE. They had been red for 12+ consecutive runs —
# a permanently-red gate is a disabled gate (AGAST #1324). The fix is NOT
# continue-on-error (that is a green-looking non-gate); instead `rz` consults
# the explicit, per-project `build` entries in known-failures/ (there
# is deliberately no test gate — a test-side excuse would excuse behavioural
# failure, which scripts/regression.sh's house rule forbids; the test sweep
# consults the build list, since a project that cannot compile fails its
# tests for that same compile reason). Excluded projects still build/test
# with full output and are named in the job summary with their AGAST task;
# an excluded project that starts PASSING fails the job until it is delisted.
# That strict-xpass rule forces stale entries out — it does not prevent new
# entries being added, so treat additions to the list as review-worthy.
jobs:
  build-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python, toolchain and ritz0 dependencies
        uses: ./.github/actions/setup
        with:
          clang-version: ${{ env.CLANG_VERSION }}

      - name: Build workspace
        run: ./rz build --all

      # AGAST #2107. valet -> zeus -> nexus over real HTTP with max-size
      # pages (#2104): POST/GET a ~50 KB page, keep-alive after it, a clean
      # 413 for an oversize body, and a slow reader that forces valet to
      # resume a short send. It needs the debug zeus, valet and nexus built
      # by the step above. It is deliberately NOT nexus's package test.sh:
      # `rz test --all -j N` would build zeus/valet from inside it while their
      # own tests build them too, racing the same build dirs. ~1s when
      # healthy; the timeout bounds a wedged server.
      - name: E2E valet -> zeus -> nexus
        run: bash projects/nexus/test/e2e_large_page.sh
        timeout-minutes: 5

      # AGAST #2190. valet HTTPS against OpenSSL over a real socket. The
      # in-process TLS tests cannot reach valet_handle_tls_connection, and
      # shell suites are not part of `rz test` (#1403), so it runs here.
      - name: E2E valet HTTPS over a real socket
        run: bash projects/valet/test/test_tls_socket.sh
        timeout-minutes: 5

      # AGAST #2201. Plain-HTTP requests whose headers span several reads.
      - name: E2E valet request split across reads
        run: bash projects/valet/test/test_split_request.sh
        timeout-minutes: 5

      # AGAST #3678. Plain-HTTP write_buf responses that go out in short
      # sends under a small SO_SNDBUF arrive whole, then keep-alive goes on.
      - name: E2E valet plain-HTTP short sends
        run: bash projects/valet/test/test_short_send.sh
        timeout-minutes: 5

      # AGAST #1865. Request framing shared with projects/http: CL+TE,
      # duplicate or invalid Content-Length, chunked bodies, pipelining,
      # and Range past the end of a file.
      - name: E2E valet request framing
        run: bash projects/valet/test/test_framing.sh
        timeout-minutes: 5

      # AGAST #3900. A >8 KB request answered with a >8 KB response: the
      # response buffer must not unmap the request the handler still reads.
      - name: E2E valet large request and response
        run: bash projects/valet/test/test_large_echo.sh
        timeout-minutes: 5

      # AGAST #3899. A static 416 or 403 says keep-alive and the next
      # pipelined request is served; as the last request it says close and
      # valet closes.
      - name: E2E valet static 416/403 connection handling
        run: bash projects/valet/test/test_static_conn.sh
        timeout-minutes: 5

      # AGAST #1495. valet's command line (ritzlib.argspec): a bad --port or
      # --workers value is a usage error, not a silent 0; paths and switches
      # reach their consumers.
      - name: E2E valet command line
        run: bash projects/valet/test/test_cli.sh
        timeout-minutes: 5

      # AGAST #2464. stack.wrk_index puts 64 connections on / through
      # zeus -w 2; ubuntu-latest has no wrk. ci_local.py treats this as a
      # setup step ("install test tools"), like the toolchain install.
      # AGAST #2743: the script retries with backoff (the runners lost DNS
      # for the Ubuntu mirrors three runs in a row) and fails loudly if wrk
      # never installs; the smoke stack never runs without it.
      - name: Install test tools (wrk for the smoke stack)
        run: bash .github/scripts/install_wrk.sh
        timeout-minutes: 10

      # AGAST #2456. Stack smoke gate: every Linux [[bin]] answers --help,
      # then valet, tome (io_uring and -b), mausoleum (write, restart, read),
      # valet -> zeus -> nexus + mausoleum, sage/goliath/rzrz/ritz-lsp and
      # rzsh are started and spoken to over real sockets and pipes. What is
      # broken today is a STRICT xfail citing its child ticket (#2457-#2462),
      # so a fix fails this step until its xfail is deleted. ~30s; it kills
      # every process group it starts, on failure too.
      - name: Smoke stack (start every server and CLI, real requests)
        run: python3 projects/ritz/tools/smoke_stack
        timeout-minutes: 4

      # AGAST #1845. Boot harland. Until this step nothing failed when the
      # kernel stopped booting. tools/test_tier1_boot.sh (#2132) boots it
      # twice under OVMF (TCG: no root, KVM or network): harland's own
      # BOOTX64.EFI, then GRUB-EFI via multiboot2. Each boot must run init's
      # Tier-1 suite to ALL TESTS PASSED, with no KERNEL PANIC or EXCEPTION
      # and a verdict before the serial log stalls. ci_local.py runs this
      # step too, so every room's gate boots harland. ~1 min locally.
      #
      # Exit codes: 1 = the boot failed; 3 = a tool is missing. ci_local
      # reads 3 as SETUP ERROR (no verdict: not a pass, not a regression);
      # here any non-zero is red. The install step is a setup step, so
      # ci_local skips it, and local hosts provide the same packages.
      # AGAST #4222: the .debs are cached between runs, so a slow Ubuntu
      # mirror (two 10-minute timeouts on 2026-11-18) is only met when the
      # runner image or the package list changes. restore-keys reuses last
      # image's debs; apt fetches only what changed and autoclean prunes.
      # ImageOS/ImageVersion are runner env vars, not in the `env` context.
      # Named as a setup step so ci_local skips it.
      - name: Install test tools (runner image key for the boot tools' .deb cache)
        id: boot-image
        run: echo "key=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"

      - name: Cache the boot tools' .debs
        uses: actions/cache@v4
        with:
          path: ~/.cache/boot-tools-debs
          key: boot-tools-debs-${{ hashFiles('.github/scripts/install_boot_tools.sh') }}-${{ steps.boot-image.outputs.key }}
          restore-keys: boot-tools-debs-${{ hashFiles('.github/scripts/install_boot_tools.sh') }}-

      - name: Install test tools (QEMU, OVMF, GRUB-EFI for the harland boot)
        run: bash .github/scripts/install_boot_tools.sh
        env:
          BOOT_TOOLS_DEB_CACHE: ~/.cache/boot-tools-debs
        timeout-minutes: 10

      # The serial logs go to projects/harland/build/boot-logs (cleared
      # first so a local run never uploads or reads a stale log) and are
      # uploaded below whether the boot passes or fails.
      - name: Boot harland under OVMF (native + GRUB-EFI, init Tier-1 suite)
        run: |
          rm -rf projects/harland/build/boot-logs
          mkdir -p projects/harland/build/boot-logs
          KEEP_WORK="$PWD/projects/harland/build/boot-logs" bash projects/harland/tools/test_tier1_boot.sh
        timeout-minutes: 10
        env:
          # Per-boot cap, however busy the serial log. A hang fails sooner:
          # once the log is idle for BOOT_STALL (90 s). ~20 s locally, but a
          # TCG boot on a host at load ~100 took 97 s (AGAST #4078); two
          # boots at the cap still fit the step's 10 minutes.
          BOOT_TIMEOUT: '240'

      # AGAST #2200. `make -C projects/harland test-uefi-boot`'s script: the
      # native UEFI boot again, in the configuration test_tier1_boot.sh does
      # not cover (256M RAM, a second virtio-blk storage disk, virtio-net,
      # virtio-mouse; prism and rzsh in the initramfs). It must reach
      # MILESTONE 12 (ALL TESTS PASSED); any lower milestone fails. Its ESP
      # is a QEMU vvfat directory, so it needs no dosfstools or mtools, only
      # the boot tools installed above (exit 3 = SETUP ERROR, as above).
      # SKIP_BUILD: the workspace build and the step above built everything.
      # ~30 s locally; the serial log is printed in the step's output.
      - name: Boot harland under OVMF (test-uefi-boot, milestone 12)
        run: bash projects/harland/boot/test.sh
        timeout-minutes: 5
        env:
          SKIP_BUILD: '1'
          BOOT_TIMEOUT: '120'

      # AGAST #3406. The hardware-inventory USB stick: esp_image.py builds
      # the raw image (GPT + FAT32 ESP, HWINV.EFI as \EFI\BOOT\BOOTX64.EFI),
      # q35 + OVMF boots it from writable USB storage, and the app dumps
      # ACPI, SMBIOS, the memory map, PCI, GOP and firmware facts to
      # \INVENTORY\<timestamp>\ on the stick. check_dump.py reads them back
      # and checks them against what QEMU was told (-smp, -m, -smbios, the
      # PCI devices). Two boots: SMBIOS entry point 64- and 32-bit. Same
      # exit codes as above. ~12 s locally; the images, serial logs and
      # dumps land with the other boot logs.
      - name: Boot the hardware-inventory stick under OVMF (dump ACPI/SMBIOS/PCI to the ESP)
        run: KEEP_WORK="$PWD/projects/harland/build/boot-logs/inventory" bash projects/harland/inventory/test.sh
        timeout-minutes: 5
        env:
          SKIP_BUILD: '1'
          BOOT_TIMEOUT: '120'

      # AGAST #1852. Boot harland under OVMF with a virtio-net NIC (QEMU
      # user net: DHCP answers inside QEMU, no host network) and an NVMe
      # controller. The NVMe's MSI-X table must be found, virtio-net must
      # come up in MSI-X mode and deliver > 0 interrupts through it, and
      # init's Tier-1 suite must still pass. Same exit codes as above;
      # msix.log lands with the other serial logs. ~20 s locally.
      - name: Boot harland with virtio-net + NVMe (MSI-X interrupt counter)
        run: KEEP_WORK="$PWD/projects/harland/build/boot-logs" bash projects/harland/tools/test_msix_boot.sh
        timeout-minutes: 5
        env:
          BOOT_TIMEOUT: '120'

      # AGAST #1850. Boot harland under OVMF from NVMe only (no virtio-blk):
      # the initramfs on one QEMU NVMe controller, a 4 MiB disk with a known
      # sector pattern on a second. drivers/nvme must read the pattern back
      # (logged FNV-1a of LBAs 1-200), the initramfs must load from NVMe and
      # init's Tier-1 suite pass, and persistent storage must format the data
      # disk (its superblock magic is checked in the image after the boot).
      # Same exit codes as above; nvme.log lands with the other serial logs.
      - name: Boot harland from NVMe (pattern read, initramfs, persist write)
        run: KEEP_WORK="$PWD/projects/harland/build/boot-logs" bash projects/harland/tools/test_nvme_boot.sh
        timeout-minutes: 5
        env:
          BOOT_TIMEOUT: '120'

      # AGAST #4088. The same boot on 4 KiB-LBA namespaces (QEMU
      # logical_block_size=4096, as some NVMe drives and EBS volumes report):
      # drivers/nvme translates 512-byte sectors to native LBAs, read-modify-
      # writes unaligned writes (persist) and uses PRP lists for multi-page
      # transfers. It must log "4096-byte LBAs". nvme-4k.log is its serial log.
      - name: Boot harland from NVMe with 4 KiB LBAs (sector translation, RMW, PRP list)
        run: KEEP_WORK="$PWD/projects/harland/build/boot-logs" bash projects/harland/tools/test_nvme_boot.sh
        timeout-minutes: 5
        env:
          BOOT_TIMEOUT: '120'
          NVME_LBA_SIZE: '4096'

      # AGAST #4253. Boot harland under OVMF with no block device at all, as
      # on EC2 Nitro or a laptop: the ESP holds harland/initramfs.tar beside
      # the kernel. BOOTX64.EFI must read it and pass it in BootInfo, the
      # kernel must unpack it from memory (not from virtio-blk) and init's
      # Tier-1 suite must pass. Same exit codes as above;
      # esp-initramfs.log lands with the other serial logs. ~20 s locally.
      - name: Boot harland with the initramfs on the ESP (no virtio-blk)
        run: KEEP_WORK="$PWD/projects/harland/build/boot-logs" bash projects/harland/tools/test_esp_initramfs_boot.sh
        timeout-minutes: 5
        env:
          BOOT_TIMEOUT: '120'

      # AGAST #4252. Boot the `make -C projects/indium shell` image (init_interactive
      # as /bin/init) and drive rzsh over the serial console: wait for the
      # prompt, run echo, pwd, ls /bin, cat /etc/motd (a spawned program),
      # a command after it, then `exit`: back to init_interactive (#1882), power-off.
      # Same exit codes as above; shell.log is the session transcript. ~10 s.
      - name: Boot harland to an rzsh prompt (scripted serial session)
        run: KEEP_WORK="$PWD/projects/harland/build/boot-logs" bash projects/harland/tools/test_shell_boot.sh
        timeout-minutes: 5
        env:
          BOOT_TIMEOUT: '120'

      - name: Upload harland boot serial logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harland-boot-serial-logs
          path: projects/harland/build/boot-logs
          if-no-files-found: warn

  test-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python, toolchain and ritz0 dependencies
        uses: ./.github/actions/setup
        with:
          clang-version: ${{ env.CLANG_VERSION }}

      - name: Test workspace
        run: ./rz test --all -j $(nproc)

  # The bootstrap chain is the language's acceptance criterion:
  #   1. compile examples with ritz0        (Python-hosted compiler)
  #   2. compile the compiler with ritz0    -> ritz1
  #   3. compile examples with ritz1
  #   4. compile the compiler with ritz1    -> self-hosted ritz
  #   5. compile examples with self-hosted ritz
  # Two gates, and they answer different questions:
  #
  #   make matrix-full        every [[test]] fn in every ritz0/test/*.ritz,
  #                           compiled and run by all three compilers, each fn
  #                           in its own process. Discovered, not listed, with
  #                           a floor (AGAST #1371). Narrow but deep.
  #
  #   scripts/regression.sh   the corpus. Each of the 85 examples is built by
  #                           ritz0 to establish a baseline (stdout + exit
  #                           code), then rebuilt by ritz1 and by
  #                           ritz1_selfhosted and *executed*, with both
  #                           compared against that baseline. This is what
  #                           steps 3 and 5 above actually mean.
  #
  # Neither subsumes the other: matrix-full covers language features the
  # corpus does not exercise, and regression.sh covers multi-module programs
  # the repros do not. Both must pass.
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python, toolchain and ritz0 dependencies
        uses: ./.github/actions/setup
        with:
          clang-version: ${{ env.CLANG_VERSION }}

      # AGAST #1803. Smoke tier first: "fully broken" in ~2 min instead of
      # ~10 min into this job (a ritz1 that builds but compiles nothing used
      # to surface only after pytest). Stops at the first failure and prints
      # per-step seconds; see tools/smoke.py. ci-local runs this step too.
      - name: Smoke
        run: make smoke
        working-directory: projects/ritz

      # AGAST #2300. The packages installed here are the ones
      # projects/ritz/requirements.lock pins, and the gate shows whether its
      # host's venv matches them. In CI any difference fails (the setup action
      # installed with the lock as constraints, so the lock is incomplete);
      # under ci-local it is reported in the gate log and does not fail,
      # because a host's shared venv is not the commit's to change. <1 s.
      - name: Python dependencies match requirements.lock
        run: python tools/python_deps.py
        working-directory: projects/ritz

      # AGAST #1311. Compile every fenced ```ritz block in the language
      # documentation with ritz0, the reference compiler.
      #
      # Runs before the unit tests because it is ~15s and catches the class
      # of breakage (a doc teaching syntax the compiler rejects) that is
      # cheapest to read about first.
      - name: Documentation examples compile
        run: make check-doc-examples
        working-directory: projects/ritz

      # AGAST #1837. docs/RITZ_TOML_SPEC.md is generated from manifest.py, the
      # schema every ritz.toml / rz.toml is validated against; fail on drift.
      - name: Manifest spec matches schema
        run: make check-manifest-spec
        working-directory: projects/ritz

      - name: tools/ unit tests
        run: make tools-unit
        working-directory: projects/ritz

      # AGAST #3729. Every examples/**/test/*.ritz [[test]] suite, with ritz0.
      # Nothing else runs them: rz.toml excludes examples from `rz test --all`
      # (Test workspace), and regression.sh runs each example's test.sh, not
      # its test/*.ritz. Known failures are listed in tools/example_tests.py,
      # each citing its ticket; one that passes is stale and fails the step,
      # as does a test file on disk that did not run. ~40 s cold.
      - name: Example [[test]] suites
        run: make example-tests
        working-directory: projects/ritz

      # Self-tests for scripts/regression.sh itself, which is the gate the
      # "Differential corpus regression" step below runs. Cheap (well under a
      # minute, compiles nothing) and placed before the bootstrap so a broken
      # harness is reported early rather than after a 20-minute build.
      #
      # scripts/test-regression-stage5.sh had existed for some time wired into
      # nothing at all. Both holes these cover — Stage 5's allowlist escape
      # hatch and #1359's rotted example allowlist — were states in which the
      # end-to-end regression run printed green.
      - name: Regression harness self-tests
        run: make harness-selftest
        working-directory: projects/ritz

      # AGAST #1802. Build both compilers ONCE, in parallel, before anything
      # that needs them. Without this, the first of ~80 pytest module fixtures
      # did a cold serial `make -C ritz1 ritz1`, and matrix-full's --rebuild
      # then built ritz1_selfhosted serially too. Now those are make no-ops,
      # and regression.sh Stage 4 reuses the same binaries. RITZ1_JOBS caps -j.
      - name: Build ritz1 + ritz1_selfhosted
        run: make ritz1-bootstrap
        working-directory: projects/ritz

      # AGAST #1556. ritz1's own unit suites (ritz1/test/*.ritz: nfa, regex,
      # lexer), built by ritz0 and run as [[test]] files. Red on a file
      # that runs zero tests and on finding zero files: the 23 programs that
      # sat in ritz1/test/ before were run by nothing and could not fail.
      - name: ritz1 unit suites
        run: make ritz1-unit
        working-directory: projects/ritz

      # AGAST #3805. ritzlib/tests under ritz1 and ritz1_selfhosted. The
      # regression matrix was the only ritz1 run, and two whole ritzlib test
      # files rotted under ritz1 unseen (#3766). ritz0 runs them in the
      # test job's `rz test --all` and the train's package step (#3909). ~40 s.
      - name: ritzlib tests (ritz1 + ritz1_selfhosted)
        run: make ritzlib-tests-ritz1
        working-directory: projects/ritz

      # AGAST #3928. The documentation examples again, under ritz1 and
      # ritz1_selfhosted (the step above "Documentation examples compile" is
      # ritz0's). Known ritz1 failures each name an open ticket and fail the
      # step once they pass. ~1 s per compiler.
      - name: Documentation examples compile (ritz1 + ritz1_selfhosted)
        run: make check-doc-examples-ritz1
        working-directory: projects/ritz

      # AGAST #1848 (M2.2): the self-hosted compilers build the OS. build-all
      # boots harland built by ritz0 (#1845); these two steps rebuild harland
      # (kernel ELF + BOOTX64.EFI) and every initramfs package with ritz1,
      # then ritz1_selfhosted, and run the same two boots (native UEFI and
      # GRUB-EFI) to init's ALL TESTS PASSED. COMPILER= makes the script
      # build with `--compiler` and fail unless every binary it boots has a
      # manifest naming that compiler. ~40 s each locally (build + 2 boots).
      # Exit 3 = SETUP ERROR, as in build-all; tools/test_ci_harland_boot.py
      # pins the wiring.
      - name: Install test tools (QEMU, OVMF, GRUB-EFI for the ritz1-built boots)
        run: bash .github/scripts/install_boot_tools.sh
        timeout-minutes: 10

      - name: Boot harland built by ritz1 (native + GRUB-EFI, init Tier-1 suite)
        run: |
          rm -rf projects/harland/build/boot-logs/ritz1
          mkdir -p projects/harland/build/boot-logs/ritz1
          COMPILER=ritz1 KEEP_WORK="$PWD/projects/harland/build/boot-logs/ritz1" bash projects/harland/tools/test_tier1_boot.sh
        timeout-minutes: 10
        env:
          BOOT_TIMEOUT: '120'

      - name: Boot harland built by ritz1_selfhosted (native + GRUB-EFI, init Tier-1 suite)
        run: |
          rm -rf projects/harland/build/boot-logs/ritz1_selfhosted
          mkdir -p projects/harland/build/boot-logs/ritz1_selfhosted
          COMPILER=ritz1_selfhosted KEEP_WORK="$PWD/projects/harland/build/boot-logs/ritz1_selfhosted" bash projects/harland/tools/test_tier1_boot.sh
        timeout-minutes: 10
        env:
          BOOT_TIMEOUT: '120'

      - name: Upload ritz1-built harland boot serial logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harland-ritz1-boot-serial-logs
          path: projects/harland/build/boot-logs
          if-no-files-found: warn

      # AGAST #1327. Tests must build what they need rather than skip when an
      # artifact is missing: the 10 cache-identity tests from #1279 never
      # executed in CI while their collection-time skipif was in place. ritz1
      # is now prebuilt by the step above, but a test run on its own (or
      # after a clean) still has to stand alone. The grep is defence in depth:
      # if an artifact-existence skip ever reappears, fail loudly instead of
      # reporting success while asserting nothing.
      #
      # AGAST #1804: in parallel under pytest-xdist.  `-n auto` is the runner's
      # 4 vCPUs; --maxprocesses 8 caps it on a bigger host (ci-local runs this
      # line on the ~15 GB WSL VM).  `--dist loadgroup` keeps the tests that
      # share in-tree state -- xdist_group("tree"), see ritz0/conftest.py --
      # on one worker.  The xdist controller builds ritz1 once, before any
      # worker starts; the -rs skip report and the grep below are unchanged.
      #
      # AGAST #2793: --disable-plugin-autoload -p xdist.  A pytest that has
      # whatever plugins its environment installed (ci-local runs the caller's
      # venv: django, anyio, ddtrace, ...) paid them on every one of ~31k
      # tests; the xdist controller topped out near 300 trivial tests/s.  The
      # suite uses only xdist and its own conftest plugins.
      #
      # AGAST #3453 (LARB review/5 F1): the suite went from 2,898 to 39,054
      # tests in three weeks.  --durations puts the slowest tests in every
      # gate log; --cost-report (ritz0/cost_meter.py) sums CPU-seconds per
      # file and prints the costliest files; tools/check_test_budget.py then
      # fails the step if a file or the suite is over tools/test_budget.toml.
      - name: ritz0 unit tests
        run: |
          set -o pipefail
          # AGAST #4138: a slow host's budget scale (host.env's
          # RZ_TEST_BUDGET_SCALE, which run-gate.sh passes in) is for the
          # budget check alone.  Taken out of the environment here so pytest
          # never inherits it: the budget tool's own tests assert on
          # scale-1 output.  Unset on CI: scale 1.
          BUDGET_SCALE="${RZ_TEST_BUDGET_SCALE:-${RITZ_TEST_BUDGET_SCALE:-1}}"
          unset RZ_TEST_BUDGET_SCALE RITZ_TEST_BUDGET_SCALE
          # AGAST #4172: a host's fixed CPU factor (host.env's RZ_CPU_FACTOR,
          # passed in by run-gate.sh) replaces the live calibration below.
          # Handed over as --factor and unset, so pytest never inherits it.
          # Unset on CI and most hosts: measured.
          CPU_FACTOR="${RZ_CPU_FACTOR:-}"
          unset RZ_CPU_FACTOR
          # AGAST #3897: tmp_path on disk, not a tmpfs /tmp (toffee's), where a
          # full /tmp put the host under memory pressure that inflated per-file
          # CPU-s 2-12x.  Fresh per run, so two gates on one host never share it.
          mkdir -p "$HOME/.cache/ritz-pytest"
          BASETEMP=$(mktemp -d "$HOME/.cache/ritz-pytest/run.XXXXXX")
          # AGAST #4274: chmod first, or a mode-000 dir a test left stops rm.
          trap 'chmod -R u+rwx "$BASETEMP" 2>/dev/null; rm -rf "$BASETEMP"' EXIT
          # AGAST #3897: CPU-s differ by host (toffee measures ~0.62x omegalisk).
          # Time a fixed workload here first; the budget check divides by it.
          python ../tools/cpu_calibrate.py --out cpu-calibration.json --scratch "$BASETEMP" ${CPU_FACTOR:+--factor "$CPU_FACTOR"}
          python -m pytest -q -rs --disable-plugin-autoload -p xdist -n auto --maxprocesses 8 --dist loadgroup --durations=30 --cost-report=pytest-cost.json --basetemp="$BASETEMP" | tee pytest-report.txt
          # Matches the reason only (after "file:line: "), so a file name
          # like test_missing_x.py can't trip it. Environment skips ("clang
          # not on PATH", "valgrind not installed", "CPU lacks AES-NI") are
          # legitimate and must not match: ritz0/test_no_artifact_skips.py
          # pins both lists against this exact regex (AGAST #1333).
          if grep -iE "SKIPPED \[[0-9]+\] [^ ]+: .*(not built|not checked out|not present|does not exist|no such file|not found|missing|no .* found)" pytest-report.txt; then
            echo "::error::a test skipped because a file or build artifact was missing — build it in the test, or assert on it if it is tracked (see AGAST #1327, #1333)"
            exit 1
          fi
          RITZ_TEST_BUDGET_SCALE="$BUDGET_SCALE" python ../tools/check_test_budget.py pytest-cost.json --calibration cpu-calibration.json
        working-directory: projects/ritz/ritz0

      # Both steps carry an explicit timeout. GitHub's default is the job-level
      # six hours, which is not a useful bound for a test step: a deadlocked
      # run burns a runner for an afternoon and reports nothing. These budgets
      # are roughly 3x the observed cost (matrix ~72s, differential ~6m25s), so
      # tripping one means something is wedged, not merely slow.
      - name: Bootstrap chain + regression matrix
        run: make matrix-full
        working-directory: projects/ritz
        timeout-minutes: 20
        env:
          RITZ_VERIFY_IR: '1'

      - name: Differential corpus regression (ritz0 vs ritz1 vs self-hosted)
        run: ./scripts/regression.sh
        working-directory: projects/ritz
        timeout-minutes: 25
        # Run the LLVM verifier on every module we emit, before handing it to
        # clang. Pinning the toolchain makes the allowlist mean one thing;
        # this makes it stop depending on the toolchain at all. Invalid IR now
        # fails at the point of emission with the offending function named,
        # rather than surviving until some future clang tightens its verifier
        # and turns a two-year-old codegen bug into a mystery CI break.
        env:
          RITZ_VERIFY_IR: '1'
