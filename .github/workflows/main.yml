name: Main Branch Validation
on:
  push:
    branches: [main]

jobs:
  build-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ritz0 dependencies
        run: python -m pip install --upgrade pip -r projects/ritz/requirements.txt

      - name: Set up RITZ_PATH
        run: echo "RITZ_PATH=$PWD/projects" >> $GITHUB_ENV

      - name: Build all projects
        run: |
          for proj in projects/*/; do
            [ -f "$proj/Makefile" ] || continue
            name=$(basename "$proj")
            if ! make -C "$proj" -n build >/dev/null 2>&1; then
              echo "=== Skipping $name (no 'build' target) ==="
              continue
            fi
            echo "=== Building $name ==="
            (cd "$proj" && make build) || exit 1
          done

  test-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ritz0 dependencies
        run: python -m pip install --upgrade pip -r projects/ritz/requirements.txt

      - name: Set up RITZ_PATH
        run: echo "RITZ_PATH=$PWD/projects" >> $GITHUB_ENV

      - name: Test all projects
        run: |
          for proj in projects/*/; do
            [ -f "$proj/Makefile" ] || continue
            name=$(basename "$proj")
            if ! make -C "$proj" -n test >/dev/null 2>&1; then
              echo "=== Skipping $name (no 'test' target) ==="
              continue
            fi
            echo "=== Testing $name ==="
            (cd "$proj" && make test) || exit 1
          done

  # ritz-lint is an AI-assisted reviewer: it shells out to the `claude` CLI and
  # needs an authenticated subscription. That is not available to CI runners, so
  # this job is advisory only and must never gate a merge. Run it locally with
  #   python projects/larb/tools/ritz-lint/ritz_lint.py projects/
  lint-all:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run ritz-lint on all (advisory)
        run: |
          if ! command -v claude >/dev/null 2>&1; then
            echo "::notice::claude CLI unavailable on CI runners - skipping ritz-lint."
            exit 0
          fi
          if [ -f projects/larb/tools/ritz-lint/ritz_lint.py ]; then
            python projects/larb/tools/ritz-lint/ritz_lint.py projects/
          fi
