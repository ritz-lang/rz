name: Main Branch Validation
on:
  push:
    branches: [main]

# CI drives the workspace through `./rz`, the same entry point developers use.
#
# It used to loop over projects/*/ running `make build` / `make test`. That
# predates db2402e ("Remove 40 legacy build scripts"), which moved every
# project onto `rz build` / `rz test`. The loop kept several projects green by
# accident: some Makefiles invoked scripts deleted in that commit, one had a
# phony target colliding with its output directory so `build` only ran mkdir,
# and another swallowed compiler errors with `2>/dev/null || true`. Calling rz
# directly means CI exercises the real build graph from ritz.toml.

jobs:
  build-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install toolchain
        # lld provides lld-link, required to link PE/COFF UEFI targets
        # (harland's bootx64). GNU ld cannot link COFF objects.
        run: sudo apt-get update && sudo apt-get install -y lld

      - name: Install ritz0 dependencies
        run: python -m pip install --upgrade pip -r projects/ritz/requirements.txt

      - name: Build workspace
        run: ./rz build --all

  test-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install toolchain
        # lld provides lld-link, required to link PE/COFF UEFI targets
        # (harland's bootx64). GNU ld cannot link COFF objects.
        run: sudo apt-get update && sudo apt-get install -y lld

      - name: Install ritz0 dependencies
        run: python -m pip install --upgrade pip -r projects/ritz/requirements.txt

      - name: Test workspace
        run: ./rz test --all

  # The bootstrap chain is the language's acceptance criterion:
  #   1. compile examples with ritz0        (Python-hosted compiler)
  #   2. compile the compiler with ritz0    -> ritz1
  #   3. compile examples with ritz1
  #   4. compile the compiler with ritz1    -> self-hosted ritz
  #   5. compile examples with self-hosted ritz
  # Two gates, and they answer different questions:
  #
  #   make matrix-full        50 single-file test_issue_*.ritz repros compiled
  #                           and run by all three compilers. Narrow but deep.
  #
  #   scripts/regression.sh   the corpus. Each of the 85 examples is built by
  #                           ritz0 to establish a baseline (stdout + exit
  #                           code), then rebuilt by ritz1 and by
  #                           ritz1_selfhosted and *executed*, with both
  #                           compared against that baseline. This is what
  #                           steps 3 and 5 above actually mean.
  #
  # Neither subsumes the other: matrix-full covers language features the
  # corpus does not exercise, and regression.sh covers multi-module programs
  # the repros do not. Both must pass.
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install toolchain
        # lld provides lld-link, required to link PE/COFF UEFI targets
        # (harland's bootx64). GNU ld cannot link COFF objects.
        run: sudo apt-get update && sudo apt-get install -y lld

      - name: Install ritz0 dependencies
        run: python -m pip install --upgrade pip -r projects/ritz/requirements.txt

      - name: ritz0 unit tests
        run: python -m pytest -q
        working-directory: projects/ritz/ritz0

      # Both steps carry an explicit timeout. GitHub's default is the job-level
      # six hours, which is not a useful bound for a test step: a deadlocked
      # run burns a runner for an afternoon and reports nothing. These budgets
      # are roughly 3x the observed cost (matrix ~72s, differential ~6m25s), so
      # tripping one means something is wedged, not merely slow.
      - name: Bootstrap chain + regression matrix
        run: make matrix-full
        working-directory: projects/ritz
        timeout-minutes: 20

      - name: Differential corpus regression (ritz0 vs ritz1 vs self-hosted)
        run: ./scripts/regression.sh
        working-directory: projects/ritz
        timeout-minutes: 25

  # ritz-lint is an AI-assisted reviewer: it shells out to the `claude` CLI and
  # needs an authenticated subscription. That is not available to CI runners, so
  # this job is advisory only and must never gate a merge. Run it locally with
  #   python projects/larb/tools/ritz-lint/ritz_lint.py projects/
  lint-all:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run ritz-lint on all (advisory)
        run: |
          if ! command -v claude >/dev/null 2>&1; then
            echo "::notice::claude CLI unavailable on CI runners - skipping ritz-lint."
            exit 0
          fi
          if [ -f projects/larb/tools/ritz-lint/ritz_lint.py ]; then
            python projects/larb/tools/ritz-lint/ritz_lint.py projects/
          fi
