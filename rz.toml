[workspace]
name = "ritz-ecosystem"
version = "0.1.0"
description = "Ritz programming language ecosystem monorepo"

# All projects in the workspace
#
# `rz build --all` / `rz test --all` sweep exactly this list; `rz` reads it
# (it did not before AGAST #1345, so this list was decorative). `projects/**`
# walks to any depth, so every ritz.toml under projects/ is a workspace
# project unless [workspace.exclude] below says otherwise. This used to be
# `projects/*` (one level) plus hand-named nested packages, and a nested
# package nobody remembered to name was in no gate (AGAST #1383:
# ritzunit/inventory went red->green unobserved). A pattern that matches
# nothing is an error.
members = [
    "projects/**",
    "bench/regressions/2026-05-04/*",
]

# Packages under a member pattern that the --all sweep deliberately skips.
# path = "the gate that covers it instead". Each entry drops that directory
# and everything below it. An empty reason is an error, and so is an entry
# that no longer matches a package, so an exclusion cannot outlive the
# package it excuses. Nothing here stops `rz build <path>` reaching these
# packages by path. Enforced by projects/ritz/tools/test_nested_packages.py,
# which also fails if any ritz.toml is in neither set.
[workspace.exclude]
"projects/ritz/examples" = "scripts/regression.sh builds and runs every example, against its own allowlists"
"projects/ritz/docs/archive" = "retired, non-authoritative code (docs/archive/README.md); nothing in it should build (AGAST #1405)"
"projects/ritz/ritz1" = "built by `make -C projects/ritz ritz1` in ci-local and exercised by the regression matrix. Its test/*.ritz are compiler inputs, not suites: `rz test ritz/ritz1` measured 22 of 22 files with no [[test]] functions (AGAST #1386)"
"projects/harland/boot" = "not a standalone package: harland's own ritz.toml builds it as [[bin]] bootx64 (sources = boot/src); standalone it links as an ELF with no main"

# Default build settings
[build]
cache = true
parallel = true
max_jobs = 8

# Agent coordination settings
[agents]
lock_timeout_ms = 30000
claim_ttl_seconds = 600

# Known-failing exclusions for the `rz build --all` gate. The `rz test --all`
# gate consults THIS list too (a project that cannot compile fails its tests
# for the same compile reason); there is deliberately NO [ci.known_failing.test]
# — a test-side excuse would excuse behavioural failure, which the house rule
# in scripts/regression.sh forbids. Enforced by a test.
#
# Rules (validated by rz at load time, tested in projects/ritz/tools/test_rz_cli.py):
#   - Every entry MUST cite an AGAST task number (#NNNN) tracking the failure.
#   - An excused project that fails is ADVISORY: printed loudly, does not gate.
#   - An excused project that PASSES fails the gate (strict xpass) — stale
#     entries are forced out. Note this does NOT prevent new entries being
#     added; treat additions as review-worthy.
#   - An unlisted failure gates, always. No continue-on-error anywhere.
#
# Deliberately NOT listed:
#   - harland: bootx64 fails locally only ("lld-link not found"). CI installs
#     lld via .github/actions/install-toolchain; listing it would encode a
#     local-environment artifact and xpass-fail the first correct CI link.
#   - zeus: fixed by #1313 ("no-builtins" IR attribute), merged as 7611510.
[ci.known_failing.build]
# angelo removed by #1321 — the gate is strict-xpass, so this entry must go
# in the same change that turns angelo green.
lexis = "AGAST #2162 — `rz build` stops at import resolution: 'Conflicting function definition' for is_whitespace, emit_comment, emit_doctype and css_value_keyword/length/number. That hides the per-module compile errors behind it, each with its own ticket: StrView `.data` (#2211), `==` on StrView (#2212), `==` on enum Tag (#2213), module-qualified names and the i8 field errors they cause (#2214), trait-typed EventHandler calls with no dynamic dispatch (#2216), `== _` placeholders (#2217), a fn-pointer field called as a method (#2218), mutable borrows of `let` (#2219), and call sites out of step with their definitions (#2220). No ownership errors remain."
tempest = "AGAST #1302 — lib/document.ritz dereferences vec_get's by-value result ('Cannot dereference non-pointer: Node') and lib/tab_renderer.ritz can't store a `:&` param in a `:&` field ('cannot store IpcChannel to IpcChannel**'). Also String.as_strview doesn't exist (#2221, lib/chrome.ritz, lib/tab.ritz), lib/network.ritz needs a generic HashMap (#1858), and lib/tab_renderer.ritz stores a StrView in ConsoleLog's String payload (#2222, hidden behind the #1302 error)."
